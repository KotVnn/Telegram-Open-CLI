version: 2

project_name: toc

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: toc
    binary: toc
    dir: ./cmd/toc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/KotVnn/Telegram-Open-CLI/pkg/version.Version={{ .Version }}
      - -X github.com/KotVnn/Telegram-Open-CLI/pkg/version.Commit={{ .ShortCommit }}
      - -X github.com/KotVnn/Telegram-Open-CLI/pkg/version.BuildTime={{ .Date }}

archives:
  - id: toc
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: KotVnn
    name: Telegram-Open-CLI
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
