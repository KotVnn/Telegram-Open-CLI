version: '3.8'

services:
  toc:
    build: .
    container_name: toc
    restart: unless-stopped
    volumes:
      - toc-data:/home/toc/.toc
      - ./configs/config.toml:/home/toc/.toc/config.toml:ro
    environment:
      - TOC_TELEGRAM_TOKEN=${TOC_TELEGRAM_TOKEN}
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: toc-prometheus
    restart: unless-stopped
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"

volumes:
  toc-data:
  prometheus-data:
