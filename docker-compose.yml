services:
  toc:
    build: .
    image: telegram-opencode:latest
    container_name: toc
    restart: unless-stopped
    environment:
      - TOC_TELEGRAM_TOKEN=${TOC_TELEGRAM_TOKEN}
      # The serve subprocess is spawned by TOC inside this container.
      - TOC_CONFIG=/home/toc/.toc/config.toml
      # Provider credentials are passed through to `opencode serve`.
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - toc-data:/home/toc/.toc
      - toc-workspace:/workspace
      - ./configs/config.toml:/home/toc/.toc/config.toml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  toc-data:
  toc-workspace:
